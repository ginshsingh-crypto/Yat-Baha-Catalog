kind = "mobile"
previewPath = "/"
title = "يأت بها"
description = "Arabic-first iOS and Android lost-and-found community app, with item reporting, discovery, potential matching and return tracking using the supplied brand."
version = "1.0.0"
id = "artifacts/yat-biha"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19325

[services.development]
run = "pnpm --filter @workspace/yat-biha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yat-biha", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/yat-biha", "run", "serve" ]

[services.env]
PORT = "19325"
BASE_PATH = "/"
